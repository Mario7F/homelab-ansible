---

- name: Install baseline packages
  ansible.builtin.dnf:
    name: 
      - vim
      - tmux
      - curl
      - wget
      - git
      - rsync
      - bind-utils
      - chrony
      - firewalld
      - policycoreutils-python-utils  
    state: present

- name: Ensure chronyd is enabled and running
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

- name: Ensure firewalld is enabled and running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Set system timezone
  ansible.builtin.command:
    cmd: timedatectl set-timezone America/Chicago
  changed_when: false

- name: Configure system MOTD
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: '0644'
